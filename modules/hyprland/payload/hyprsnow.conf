general {
    # snow intensity | int: 1-10
    intensity = 10    # default:  3

    # minimum snowflake size in pixels    | float: 0.0+
    size_min = 0.5    # default:  2.0
    # maximum snowflake size in pixels    | float: 0.0+ && >= size_min
    size_max = 2.0    # default:  5.0

    # minimum fall speed in pixels/second | float: 0.0+
    speed_min = 150.0 # default: 30.0
    # minimum fall speed in pixels/second | float: 0.0+ && >= speed_min
    speed_max = 200.0 # default: 80.0

    # horizontal drift intensity          | float: 0.0 - 30.0
    drift = 10.0      # default: 20.0

    # maximum snowflake opacity           | float: 0.0 - 1.0
    max_opacity = 0.5 # default:  1.0

    # to add custom snowflakes:           | String[] (Absolute Path)
    # image_path = "/path/to/snowflake/image.png" # must be PNG and transparent
    # must be PNG with transparent background
}

# vim: ft=hyprlang:
